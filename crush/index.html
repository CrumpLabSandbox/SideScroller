<style>
  /* Single dark arcade look: canvas centered, touch controls below (portrait) or overlaid (landscape). */
  :root {
    --bg: #0a080b; --ink: #f4e9d4; --ember: #ff9a3c; --ember-soft: rgba(255, 150, 60, 0.16); --rim: rgba(255, 175, 100, 0.42);
    --f-ui: Silkscreen, 'Courier New', monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); background: var(--bg); }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; }
  #app.portrait { justify-content: center; }
  #app.portrait #stage { flex: 0 0 auto; }
  #rot { display: none; font: 10px var(--f-ui); color: rgba(255, 230, 200, 0.45); text-align: center; letter-spacing: 0.04em; padding-top: 10px; }
  #app.portrait #rot { display: block; }
  #touch { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 calc(14px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px)); pointer-events: none; opacity: 0.8; }
  #app.portrait #touch { position: relative; flex: 0 0 auto; height: 220px; align-items: center; padding: 8px 22px 0; opacity: 1; }
  #stick { width: 132px; height: 132px; border-radius: 50%; background: rgba(255, 240, 220, 0.05); border: 2px solid rgba(255, 220, 180, 0.2); position: relative; pointer-events: auto; touch-action: none; flex: none; }
  #app.portrait #stick { width: 150px; height: 150px; }
  #stick::after { content: ''; position: absolute; inset: 30%; border-radius: 50%; border: 1px dashed rgba(255, 220, 180, 0.15); }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255, 190, 120, 0.22); border: 2px solid rgba(255, 200, 150, 0.4); pointer-events: none; }
  #tbtns { display: grid; grid-template-columns: auto auto; grid-template-areas: 'dash .' 'jump fire'; gap: 10px 12px; align-items: end; pointer-events: auto; }
  .tb { font-family: var(--f-ui); color: #ffe9cf; background: var(--ember-soft); border: 2px solid var(--rim); border-radius: 50%; width: 74px; height: 74px; font-size: 11px; letter-spacing: 0.06em; touch-action: none; padding: 0; flex: none; }
  .tb:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  #bJump { grid-area: jump; width: 80px; height: 80px; font-size: 12px; }
  #bFire { grid-area: fire; width: 92px; height: 92px; font-size: 13px; background: rgba(255, 70, 100, 0.28); border-color: rgba(255, 120, 150, 0.55); }
  #bDash { grid-area: dash; width: 58px; height: 58px; font-size: 10px; justify-self: center; }
  #app.portrait #stick { width: 138px; height: 138px; }
  .tb.on { background: rgba(255, 170, 80, 0.55); transform: scale(0.95); }
  #bPause { position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--rim); background: rgba(20, 14, 12, 0.6); color: #ffe9cf; font: 12px var(--f-ui); padding: 0; z-index: 3; }
  @media (prefers-reduced-motion: reduce) { .tb.on { transform: none; } }

<script>
'use strict';
// ===================== CORE: constants, rng, physics =====================
const TILE = 16, VW = 480, VH = 272, ROWS = 17, MAXHP = 5;
const T = { AIR: 0, SOLID: 1, ONEWAY: 2, SPIKEUP: 3, SPIKEDN: 4, LAVA: 5, CRUMBLE: 6, BREAK: 7, ICE: 8, VENT: 9 };
const PH = {
  runMax: 150, accG: 1500, decG: 1900, accA: 1100, decA: 600, iceAcc: 380, iceDec: 170,
  jumpV: 420, djV: 360, gHold: 1150, gFall: 1600, gCut: 2700, maxFall: 470,
  coyote: 0.15, buffer: 0.17,
  dashV: 400, dashT: 0.16,
  wallSlide: 60, wjVX: 175, wjVY: 390, wallLock: 0.14,
  glideFall: 42, springV: 560,
  pw: 10, ph: 14,
};

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function tileAt(L, tx, ty) {
  if (tx < 0 || tx >= L.w) return T.SOLID;
  if (ty < 0) return L.grid[tx] === T.SOLID ? T.SOLID : T.AIR;
  if (ty >= L.h) return T.AIR;
  return L.grid[ty * L.w + tx];
}
function isSolidT(L, tx, ty) {
  const t = tileAt(L, tx, ty);
  if (t === T.SOLID || t === T.ICE || t === T.VENT) return true;
  if (t === T.CRUMBLE) { const c = L.crumble.get(ty * L.w + tx); return !c || c.s < 2; }
  if (t === T.BREAK) return !(L.breakAll || L.broken.has(ty * L.w + tx));
  return false;
}
function solidRect(L, x, y, w, h, P) {
  const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.01) / TILE);
  const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.01) / TILE);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (isSolidT(L, tx, ty)) {
      if (P && P.dashT > 0 && tileAt(L, tx, ty) === T.BREAK) {
        L.broken.add(ty * L.w + tx);
        if (L.onBreak) L.onBreak(tx, ty);
        continue;
      }
      return true;
    }
  }
  return false;
}
function onewayTop(L, x, w, prevBottom, newBottom) {
  const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.01) / TILE);
  const ty = Math.floor((newBottom - 0.01) / TILE), top = ty * TILE;
  if (prevBottom > top + 0.5) return null;
  for (let tx = x0; tx <= x1; tx++) if (tileAt(L, tx, ty) === T.ONEWAY) return top;
  return null;
}
function hazardHit(L, x, y, w, h) {
  const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.01) / TILE);
  const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.01) / TILE);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const t = tileAt(L, tx, ty);
    let rx, ry, rw, rh;
    if (t === T.SPIKEUP) { rx = tx * 16 + 2; ry = ty * 16 + 9; rw = 12; rh = 7; }
    else if (t === T.SPIKEDN) { rx = tx * 16 + 2; ry = ty * 16; rw = 12; rh = 7; }
    else if (t === T.LAVA) { rx = tx * 16; ry = ty * 16 + 6; rw = 16; rh = 10; }
    else continue;
    if (x < rx + rw && x + w > rx && y < ry + rh && y + h > ry) return true;
  }
  for (const s of L.saws) {
    const cx = Math.max(x, Math.min(s.x, x + w)), cy = Math.max(y, Math.min(s.y, y + h));
    const dx = s.x - cx, dy = s.y - cy, r = s.r - 2;
    if (dx * dx + dy * dy < r * r) return true;
  }
  return false;
}

function newPlayer(x, y) {
  return {
    x, y, vx: 0, vy: 0, onGround: true, onOneway: false, groundIce: false, coyote: 0, buffer: 0,
    jumping: false, spring: false, canDJ: false, dashAvail: true, dashT: 0, dashCD: 0, dashVX: 0, dashVY: 0,
    wall: 0, wallLock: 0, lockDir: 0, sliding: false, gliding: false, glideArmed: false, inDraft: false,
    face: 1, plat: null, dropT: 0, z: 0, vz: 0, lane: 0,
  };
}

// returns 0 ok, 1 hazard, 2 pit
function stepPlayer(P, inp, L, dt, ab, fx) {
  const pw = PH.pw, ph = PH.ph;
  const hor = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  if (inp.jumpPressed) P.buffer = PH.buffer; else if (P.buffer > 0) P.buffer -= dt;
  if (P.onGround) P.coyote = PH.coyote; else if (P.coyote > 0) P.coyote -= dt;
  if (P.wallLock > 0) P.wallLock -= dt;
  if (P.dashCD > 0) P.dashCD -= dt;
  if (P.dropT > 0) P.dropT -= dt;

  function jump(v) {
    P.vy = -v;
    if (P.plat) { P.vx += (P.plat.vx || 0) * 0.6; P.vy += Math.min(0, P.plat.vy || 0); }
    P.onGround = false; P.coyote = 0; P.buffer = 0; P.jumping = true; P.canDJ = ab.dj; P.spring = false;
    fx && fx.jump && fx.jump(P);
  }

  if (inp.dashPressed && ab.dash && P.dashAvail && P.dashT <= 0 && P.dashCD <= 0) {
    let dx = hor, dy = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
    if (P.onGround && dy > 0) dy = 0;
    if (dx === 0 && dy === 0) dx = P.face;
    const m = Math.hypot(dx, dy);
    P.dashVX = dx / m * PH.dashV; P.dashVY = dy / m * PH.dashV;
    P.dashT = PH.dashT; P.dashAvail = false; P.dashCD = 0.22;
    P.gliding = false; P.jumping = false; P.spring = false; P.wallLock = 0;
    if (dx) P.face = dx > 0 ? 1 : -1;
    fx && fx.dash && fx.dash(P);
  }

  let maxF = PH.maxFall;
  if (P.dashT > 0) {
    P.dashT -= dt; P.vx = P.dashVX; P.vy = P.dashVY;
    if (P.buffer > 0 && P.coyote > 0 && P.dashVY >= 0) {
      P.dashT = 0; const keep = P.dashVX * 0.85; jump(PH.jumpV); P.vx = keep;
    } else if (P.dashT <= 0) { P.vx = P.dashVX * 0.6; P.vy = P.dashVY * 0.35; }
  } else {
    const ice = P.onGround && P.groundIce;
    const acc = P.onGround ? (ice ? PH.iceAcc : PH.accG) : PH.accA;
    const dec = P.onGround ? (ice ? PH.iceDec : PH.decG) : PH.decA;
    const h = P.wallLock > 0 ? P.lockDir : hor;
    if (h !== 0) {
      if (P.vx * h < 0) P.vx += h * (acc + dec) * dt;
      else if (Math.abs(P.vx) <= PH.runMax) { P.vx += h * acc * dt; if (P.vx * h > PH.runMax) P.vx = h * PH.runMax; }
      else { P.vx -= h * (P.onGround ? dec : PH.decA * 0.4) * dt; if (P.vx * h < PH.runMax) P.vx = h * PH.runMax; }
      if (P.wallLock <= 0) P.face = h;
    } else {
      const d = dec * dt; P.vx = Math.abs(P.vx) <= d ? 0 : P.vx - Math.sign(P.vx) * d;
    }
    P.wall = 0;
    if (ab.wall && !P.onGround) {
      if (solidRect(L, P.x + pw, P.y + 3, 3, ph - 6)) P.wall = 1;
      else if (solidRect(L, P.x - 3, P.y + 3, 3, ph - 6)) P.wall = -1;
    }
    if (P.buffer > 0) {
      if (P.onGround && P.onOneway && inp.down) { P.dropT = 0.25; P.buffer = 0; P.onGround = false; P.coyote = 0; P.y += 2; }
      else if (P.onGround || P.coyote > 0) jump(PH.jumpV);
      else if (P.wall !== 0) {
        P.vx = -P.wall * PH.wjVX; P.vy = -PH.wjVY; P.wallLock = PH.wallLock; P.lockDir = -P.wall; P.face = -P.wall;
        P.buffer = 0; P.jumping = true; P.canDJ = ab.dj; fx && fx.wallJump && fx.wallJump(P);
      } else if (ab.dj && P.canDJ) {
        P.vy = -PH.djV; P.canDJ = false; P.buffer = 0; P.jumping = true; P.glideArmed = true; fx && fx.dj && fx.dj(P);
      } else if (ab.glide && inp.jumpPressed) { P.glideArmed = true; P.buffer = 0; }
    }
    // updraft
    P.inDraft = false;
    for (const u of L.updrafts) if (P.x + pw > u.x && P.x < u.x + u.w && P.y + ph > u.y && P.y < u.y + u.h) { P.inDraft = true; break; }
    const wantGlide = ab.glide && !P.onGround && P.glideArmed && inp.jump;
    if (wantGlide && P.inDraft) {
      P.gliding = true; P.vy -= 1300 * dt; if (P.vy < -240) P.vy = -240;
    } else {
      let g;
      if (P.vy < 0) g = (P.spring || (P.jumping && inp.jump)) ? PH.gHold : PH.gCut;
      else { g = PH.gFall; P.jumping = false; P.spring = false; }
      if (Math.abs(P.vy) < 40 && inp.jump && !P.onGround) g *= 0.5;
      P.vy += g * dt;
      P.sliding = P.wall !== 0 && hor === P.wall && P.vy > 0;
      if (P.sliding) maxF = PH.wallSlide;
      P.gliding = wantGlide && P.vy > 0 && !P.sliding;
      if (P.gliding) maxF = PH.glideFall;
      else if (P.inDraft) maxF = 160;
    }
    if (P.vy > maxF) P.vy = Math.max(maxF, P.vy - 2400 * dt);
  }

  // ---- move X
  const prevBottom = P.y + ph;
  P.x += P.vx * dt;
  if (solidRect(L, P.x, P.y, pw, ph, P)) {
    let nudged = false;
    if (P.dashT > 0 && P.dashVY === 0) {
      for (let s = 1; s <= 6; s++) if (!solidRect(L, P.x, P.y - s, pw, ph)) { P.y -= s; nudged = true; break; }
    }
    if (!nudged) {
      if (P.vx > 0) P.x = Math.floor((P.x + pw) / TILE) * TILE - pw - 0.01;
      else if (P.vx < 0) P.x = (Math.floor(P.x / TILE) + 1) * TILE;
      P.vx = 0;
    }
  }
  // ---- move Y
  P.y += P.vy * dt;
  const wasGround = P.onGround;
  P.onGround = false;
  const lastPlat = P.plat; P.plat = null;
  if (P.vy < 0) {
    if (solidRect(L, P.x, P.y, pw, ph, P)) {
      let fixed = false;
      for (let s = 1; s <= 5 && !fixed; s++) for (const d of [1, -1]) {
        if (!solidRect(L, P.x + d * s, P.y, pw, ph)) { P.x += d * s; fixed = true; break; }
      }
      if (!fixed) {
        P.y = (Math.floor(P.y / TILE) + 1) * TILE; P.vy = 0;
        if (P.dashT > 0) P.dashT = 0;
        fx && fx.bonk && fx.bonk(P);
      }
    }
  } else {
    let landY = null, one = false;
    if (solidRect(L, P.x, P.y, pw, ph, P)) landY = Math.floor((P.y + ph) / TILE) * TILE;
    if (landY === null && P.dropT <= 0) {
      const t = onewayTop(L, P.x, pw, prevBottom, P.y + ph);
      if (t !== null) { landY = t; one = true; }
    }
    if (landY === null && P.dropT <= 0) {
      for (const p of L.plats) {
        if (p.gone) continue;
        const pb = (lastPlat === p) ? p.y : prevBottom;
        if (P.x + pw > p.x && P.x < p.x + p.w && Math.min(prevBottom, pb) <= p.y + 3 && P.y + ph >= p.y) {
          landY = p.y; P.plat = p; one = true; break;
        }
      }
    }
    if (landY === null && P.vy === 0 && solidRect(L, P.x, P.y + ph, pw, 1)) { P.onGround = true; P.onOneway = false; }
    if (landY !== null) {
      P.y = landY - ph;
      if (!wasGround && fx && fx.land) fx.land(P, P.vy);
      P.vy = 0; P.onGround = true; P.onOneway = one;
      P.canDJ = ab.dj; P.dashAvail = true; P.glideArmed = false; P.jumping = false; P.spring = false;
      if (P.dashT > 0 && P.dashVY > 0) P.dashT = 0;
      const cx = Math.floor((P.x + pw / 2) / TILE), cy = Math.floor((landY + 1) / TILE);
      P.groundIce = tileAt(L, cx, cy) === T.ICE;
    }
  }
  // ---- springs
  for (const s of L.springs) {
    if (P.vy >= 0 && P.x + pw > s.x + 2 && P.x < s.x + 14 && P.y + ph > s.y + 8 && P.y + ph <= s.y + 17) {
      P.vy = -PH.springV; P.spring = true; P.jumping = false; P.onGround = false; P.coyote = 0;
      P.canDJ = ab.dj; P.dashAvail = true; P.glideArmed = false; P.dashT = 0;
      s.t = 0.3; fx && fx.spring && fx.spring(P, s);
    }
  }
  if (P.y > L.h * TILE + 8) return 2;
  if (hazardHit(L, P.x + 1, P.y + 1, pw - 2, ph - 2)) return 1;
  return 0;
}
// ===================== LEVEL CHUNKS =====================
// req letters: d=double jump, x=dash, w=wall jump, g=glide.  th: '*' any world, or world digits.
// Legend: # solid  I ice  = one-way  ^ spikes  v ceiling spikes  L lava  X crumble  B breakable  U vent

const WORLDS = [
  { name: 'Recess Grove', levels: ['The Swing Set', 'Love Note Lane', 'Cootie Thicket'], boss: 'The Friend Zone' },
  { name: 'Unsent Letter Caves', levels: ['Drafts Folder', 'Echoes of "Hey"', 'The Crystal Diary'], boss: 'The Unsent Letter' },

];
function abilitiesFor(world) { return { dj: world >= 1, dash: world >= 2, wall: world >= 3, glide: world >= 4 }; }
function reqOK(req, ab) {
  for (const c of req) {
    if (c === 'd' && !ab.dj) return false;
    if (c === 'x' && !ab.dash) return false;
    if (c === 'w' && !ab.wall) return false;
    if (c === 'g' && !ab.glide) return false;
  }
  return true;
}
function chunkRows(m) {
  let rows = m.split('\n').map(s => s.trim()).filter(s => s.length);
  const w = Math.max(...rows.map(r => r.length));
  rows = rows.map(r => r.length < w ? r + ('#IL'.includes(r[r.length - 1]) ? r[r.length - 1] : '.').repeat(w - r.length) : r);
  while (rows.length < ROWS) rows.unshift('.'.repeat(w));
  return rows;
}

// Plan every stage in order so chunks rotate instead of repeating across stages.
let PLAN = null;
function planAll() {
  PLAN = {};
  const used = new Map();
  for (let world = 0; world < 5; world++) for (let idx = 0; idx < 3; idx++) {
    const R = rng(7919 * (world + 1) + idx * 104729 + 13);
    const ab = abilitiesFor(world);
    const maxD = [[2, 2, 3], [2, 3, 3], [3, 3, 4], [3, 4, 4], [3, 4, 4]][world][idx];
    const zones = idx === 2 ? 2 : 1;
    const count = Math.max(5, [7, 8, 9][idx] + world - 2 * zones);
    const newest = '.dxwg'[world];
    const pool = CHUNKS.filter(c => reqOK(c.req, ab) && (c.th === '*' || c.th.includes(String(world))) && c.d <= maxD);
    const weight = c => (newest !== '.' && c.req.includes(newest) ? 3 : 1) * (c.th !== '*' ? 2.4 : 1) * (c.d === maxD ? 1.3 : 1) / (1 + 1.6 * (used.get(c.id) || 0));
    const pick = list => {
      let tot = 0; for (const c of list) tot += weight(c);
      let r = R() * tot;
      for (const c of list) { r -= weight(c); if (r <= 0) return c; }
      return list[list.length - 1];
    };
    const chosen = [];
    const sp = pool.filter(c => c.m.includes('*'));
    for (let i = 0; i < 3 && sp.length; i++) { const c = pick(sp); chosen.push(c); sp.splice(sp.indexOf(c), 1); }
    let rest = pool.filter(c => !chosen.includes(c));
    while (chosen.length < count) {
      if (!rest.length) rest = pool.slice();
      const c = pick(rest); chosen.push(c); rest.splice(rest.indexOf(c), 1);
    }
    for (const c of chosen) used.set(c.id, (used.get(c.id) || 0) + 1);
    const keys = new Map(chosen.map(c => [c, c.d + R() * 1.8]));
    chosen.sort((a, b) => keys.get(a) - keys.get(b));
    const n = chosen.length, fpAt = idx === 2 ? [Math.floor(n / 3) - 1, Math.floor(2 * n / 3) - 1] : [Math.floor(n / 2) - 1];
    const fpPool = FP_CHUNKS.filter(c => reqOK(c.req, ab) && c.d <= Math.max(1, maxD - 1) + (world >= 2 ? 1 : 0));
    const fps = new Map();
    for (const at of fpAt) {
      const run = [], left = fpPool.slice();
      for (let k = 0; k < 3; k++) {
        let tot = 0; const wt = c => 1 / (1 + 2 * (used.get(c.id) || 0));
        for (const c of left) tot += wt(c);
        let r = R() * tot, pickc = left[left.length - 1];
        for (const c of left) { r -= wt(c); if (r <= 0) { pickc = c; break; } }
        run.push(pickc); left.splice(left.indexOf(pickc), 1); used.set(pickc.id, (used.get(pickc.id) || 0) + 1);
      }
      fps.set(at, run);
    }
    PLAN[world + '-' + idx] = { chosen, mirror: chosen.map(() => R() < 0.5), seed: R(), fps };
  }
}
function buildLevel(world, idx) {
  if (!PLAN) planAll();
  const pl = PLAN[world + '-' + idx];
  const parts = [chunkRows(START_CHUNK)];
  const ids = [];
  pl.chosen.forEach((c, i) => {
    let rows = chunkRows(c.m);
    if (pl.mirror[i]) rows = rows.map(r => [...r].reverse().join(''));
    parts.push(rows); ids.push(c.id);
    if (pl.fps.has(i)) {
      parts.push(chunkRows(GATE_IN_CHUNK));
      for (const c of pl.fps.get(i)) { parts.push(chunkRows(c.m)); ids.push(c.id); }
      parts.push(chunkRows(GATE_OUT_CHUNK));
    } else if ((i + 1) % 2 === 0 && i < pl.chosen.length - 1) parts.push(chunkRows(CHECK_CHUNK));
  });
  parts.push(chunkRows(GOAL_CHUNK));
  const rows = [];
  for (let y = 0; y < ROWS; y++) rows.push(parts.map(p => p[y]).join(''));
  const L = makeLevel(rows, world, rng(Math.floor(pl.seed * 1e9)));
  L.chunkIds = ids;
  const gx = L.ents.filter(d => d.type === 'Y').map(d => d.x + 8).sort((a, b) => a - b);
  for (let k = 0; k + 1 < gx.length; k += 2) L.fpZones.push([gx[k], gx[k + 1]]);
  if (idx === 0) L.tutorial = world;
  return L;
}

function buildArena(world) {
  const rows = ARENAS[world].split('\n');
  const L = makeLevel(rows, world, rng(99 + world));
  L.arena = true;
  return L;
}

function makeLevel(rows, world, R) {
  const h = rows.length, w = rows[0].length;
  const L = {
    w, h, world, grid: new Uint8Array(w * h), crumble: new Map(), broken: new Set(), plats: [], platDefs: [],
    springs: [], updrafts: [], saws: [], ents: [], stars: [], start: null, rows, fpZones: [],
  };
  const G = L.grid;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x] || '.', i = y * w + x;
    switch (ch) {
      case '#': G[i] = T.SOLID; break;
      case 'I': G[i] = T.ICE; break;
      case '=': G[i] = T.ONEWAY; break;
      case '^': G[i] = T.SPIKEUP; break;
      case 'v': G[i] = T.SPIKEDN; break;
      case 'L': G[i] = T.LAVA; break;
      case 'X': G[i] = T.CRUMBLE; break;
      case 'B': G[i] = T.BREAK; break;
      case 'U': G[i] = T.VENT; break;
      case 'P': L.start = { x: x * 16 + 3, y: y * 16 + 16 - PH.ph }; break;
      case 'o': L.ents.push({ type: 'ember', x: x * 16 + 8, y: y * 16 + 8 }); break;
      case 'H': L.ents.push({ type: 'heart', x: x * 16 + 8, y: y * 16 + 8 }); break;
      case '*': L.stars.push({ x: x * 16 + 8, y: y * 16 + 8 }); break;
      case 'S': L.springs.push({ x: x * 16, y: y * 16, t: 0 }); break;
      case 'M': L.platDefs.push({ kind: 'h', x: x * 16 + 8 - 24, y: y * 16, w: 48, h: 8, range: 56 }); break;
      case 'N': L.platDefs.push({ kind: 'v', x: x * 16 + 8 - 24, y: y * 16, w: 48, h: 8, range: 112 }); break;
      case 'F': L.platDefs.push({ kind: 'f', x: x * 16, y: y * 16, w: 32, h: 8 }); break;
      case 'O': L.saws.push({ x: x * 16 + 8, y: y * 16 + 8, r: 10 }); break;
      case '.': break;
      default: L.ents.push({ type: ch, x: x * 16, y: y * 16 });
    }
  }
  // world-specific dressing
  if (world === 4) {
    for (let x = 0; x < w; x++) if (G[16 * w + x] === T.AIR && G[15 * w + x] === T.AIR) { G[16 * w + x] = T.LAVA; G[15 * w + x] = T.LAVA; }
  }
  if (world === 1 && !L.arena) {
    for (let x = 0; x < w; x++) {
      const clear = r => G[r * w + x] === T.AIR && !'*oVfS'.includes(rows[r][x]);
      if (clear(0) && clear(1) && clear(2)) {
        G[x] = T.SOLID;
        if (R() < 0.55 && clear(3)) G[w + x] = T.SOLID;
      }
    }
  }
  // updrafts
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (G[y * w + x] === T.VENT) {
    let top = y;
    while (top > 1 && y - top < 12 && !isSolidT(L, x, top - 1)) top--;
    L.updrafts.push({ x: x * 16, y: top * 16, w: 16, h: (y - top) * 16 });
  }
  // stars: keep 3 spread, others become embers
  if (L.stars.length > 3) {
    const s = L.stars.slice().sort((a, b) => a.x - b.x), n = s.length;
    const keep = [s[0], s[Math.round((n - 1) / 2)], s[n - 1]];
    for (const st of s) if (!keep.includes(st)) L.ents.push({ type: 'ember', x: st.x, y: st.y });
    L.stars = keep;
  }
  return L;
}

const AU = { ctx: null, master: null, music: null, sfx: null, lead: null, noiseBuf: null, song: null, songKey: '', nextT: 0, step: 0, timer: null, musicOn: true, sfxOn: true };

function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = new C(); AU.ctx = ctx;

  if (inp.P.left) G.sel = Math.max(0, G.sel - 1);
  if (inp.P.down) G.sel = Math.min(maxSel, G.sel + 4);
  if (inp.P.up) G.sel = Math.max(0, G.sel - 4);
  let go = inp.P.jump || inp.P.confirm;
  if (G.click) {
    const w = Math.floor(G.sel / 4);
    for (let k = 0; k < 4; k++) { const n = nodePos(k), idx = w * 4 + k; if (Math.hypot(G.click.x - n.x, G.click.y - n.y) < 22 && idx <= maxSel) { if (idx === G.sel) go = true; else G.sel = idx; } }

    if (G.click.x > VW - 40 && G.click.y > 110 && G.click.y < 190 && (w + 1) * 4 <= maxSel) G.sel = (w + 1) * 4;

  if (G.sel !== old) { sfx('ui'); G.mapT = 0; SAVE.cursor = G.sel; }
  if (inp.P.pause) { G.scene = 'title'; G.menu = 0; playSong('title'); return; }

  const t = G.endT;
  const a = x => Math.max(0, Math.min(1, (t - x) / 1.2));
  ENDING_LINES.forEach((l, i) => { c.globalAlpha = a(1 + i * 1.6); txt(c, l, VW / 2, 28 + i * 17 + (i === 4 ? 6 : 0), i === 4 ? 14 : 9, i === 4 ? '#fff4e2' : '#ffe6c4', 'center', i === 4 ? FD : FU); });
  let stars = 0; for (const key in SAVE.lv) stars += SAVE.lv[key].stars.filter(Boolean).length;
  c.globalAlpha = a(9.5);
  txt(c, 'MISSION COMPLETE', VW / 2, 138, 18, '#ff8aa0', 'center', FD);
  txt(c, `Time ${fmtTime(SAVE.playTime)}  ·  Setbacks ${SAVE.deaths}  ·  Mixtapes ${stars}/45`, VW / 2, 154, 8, '#fff1dc', 'center');
  c.globalAlpha = a(10.5) * (Math.sin(G.t * 5) > -0.3 ? 1 : 0); txt(c, `${btn('jump')} to return to the map`, VW / 2, 170, 8, '#3a1a10', 'center');
  c.globalAlpha = 1;
}
function updIntro(inp, dt) {
  G.introT += dt;
  if (G.introT > 1 && (inp.P.jump || inp.P.confirm || G.click)) {
    if (G.introT < INTRO.length * 1.8 + 1) G.introT = INTRO.length * 1.8 + 1;
    else { SAVE.introSeen = true; writeSave(); G.scene = 'map'; G.sel = Math.min(SAVE.cursor, SAVE.unlocked); playSong('map'); sfx('ok'); }
  }
}
function drawIntro(c) {
  const t = G.introT;
  INTRO.forEach((l, i) => { c.globalAlpha = Math.max(0, Math.min(1, (t - 0.4 - i * 1.8) / 1)); txt(c, l, VW / 2, 70 + i * 22, i === 4 ? 10 : 9, i === 4 ? '#ff8aa0' : '#f0e2d0', 'center'); });
  c.globalAlpha = Math.max(0, Math.min(1, t - INTRO.length * 1.8));
  heartIcon(c, VW / 2, 206, 12, '#e8507a'); c.strokeStyle = '#07040a'; c.lineWidth = 2; c.beginPath(); c.moveTo(VW / 2 - 1, 197); c.lineTo(VW / 2 + 3, 205); c.lineTo(VW / 2 - 2, 211); c.lineTo(VW / 2 + 1, 218); c.stroke();
  c.globalAlpha = Math.sin(G.t * 5) > -0.3 ? 0.8 : 0; txt(c, `${btn('jump')} to continue`, VW / 2, VH - 12, 8, '#ffcf8a', 'center');
  c.globalAlpha = 1;
}

// ---------- loop ----------
function update(dt) {
  G.t += dt;
  pollPad();
  const inp = readInput();
  if (inp.P.mute) { SAVE.music = !SAVE.music; setMusicOn(SAVE.music); writeSave(); }
  if (G.overlayT > 0) G.overlayT -= dt;
  if (G.fade > 0) G.fade -= dt * 2.2;
  const sc0 = G.scene;
  switch (G.scene) {
    case 'title': updTitle(inp); break;
    case 'map': updMap(inp, dt); break;
    case 'ending': updEnding(inp, dt); break;
    case 'intro': updIntro(inp, dt); break;
    case 'play':
      if (G.overlay === 'pause') updPause(inp);
      else if (G.overlay === 'brief') { if (G.overlayT <= 0 && (inp.P.jump || inp.P.confirm || G.click)) { SAVE.brief = SAVE.brief || {}; SAVE.brief[G.world] = true; writeSave(); G.overlay = null; G.banner = 3.2; sfx('ok'); } }
      else if (G.overlay === 'results') { updResults(inp); updatePlay(dt, {}); }
      else if (G.overlay === 'ability') { updAbility(inp); updatePlay(dt, {}); }
      else {
        if (inp.P.pause) { openPause(); sfx('ui'); break; }
        SAVE.playTime += dt;
        updatePlay(dt, inp);
      }
      break;
  }
  if (G.scene !== sc0 && G.scene !== 'play') G.fade = 1;
  G.click = null;
}
function render() {
  switch (G.scene) {
    case 'title': drawTitleScene(g); break;
    case 'map': drawMapScene(g); break;
    case 'play': if (G.mode === 'fp') drawFP(g); else drawPlay(g); break;
    case 'ending': drawEndingScene(g); break;
    case 'intro': g.fillStyle = '#07040a'; g.fillRect(0, 0, VW, VH); break;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, 0, 0, cv.width, cv.height);
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = true;
  switch (G.scene) {
    case 'title': drawTitleUI(ctx); break;
    case 'map': drawMapUI(ctx); break;
    case 'play':
      drawHUD(ctx);
      if (G.overlay === 'pause') drawPause(ctx);
      else if (G.overlay === 'brief') drawBrief(ctx);
      else if (G.overlay === 'results') drawResults(ctx);
      else if (G.overlay === 'ability') drawAbility(ctx);
      break;
    case 'ending': drawEndingUI(ctx); break;
    case 'intro': drawIntro(ctx); break;
  }
  if (G.fade > 0) { ctx.fillStyle = `rgba(6,4,6,${Math.min(1, G.fade)})`; ctx.fillRect(0, 0, VW, VH); }
}
let last = performance.now(), acc = 0;
function frame(now) {
  let d = (now - last) / 1000; last = now;
  if (d > 0.25) d = 0.25;
  acc += d;
  const STEP = 1 / 60;
  let n = 0;
  while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; }
  if (n >= 6) acc = 0;
  render();
  requestAnimationFrame(frame);
}

// ---------- boot ----------
loadSave();
AU.musicOn = SAVE.music; AU.sfxOn = SAVE.sfx;
G.sel = Math.min(SAVE.cursor, SAVE.unlocked);
G.touch = matchMedia('(pointer: coarse)').matches;
if (G.touch) G.lastInput = 'touch';
setupTouch();
layout();
playSong('title');
if (document.fonts && document.fonts.load) { document.fonts.load("16px 'Pixelify Sans'"); document.fonts.load('8px Silkscreen'); }
requestAnimationFrame(frame);
</script>
