<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hollow Dash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Hollow Dash — a fast, endless side-scrolling platformer for your phone and browser.">
  <meta name="theme-color" content="#1c2752">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hollow Dash">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="touch" aria-hidden="true"></div>

  <div id="hud">
    <div id="hearts" class="hud-item"></div>
    <div id="score" class="hud-item hud-score">0</div>
    <div class="hud-item hud-coins"><span class="coin-ico"></span><span id="coins">0</span></div>
    <div class="hud-buttons">
      <button id="btn-sound" class="icon-btn" aria-label="Mute">🔊</button>
      <button id="btn-pause" class="icon-btn" aria-label="Pause">❚❚</button>
    </div>
  </div>

  <div id="overlay">
    <section id="screen-title" class="screen">
      <h1 class="logo"><span>HOLLOW</span><span>DASH</span></h1>
      <p class="tagline">Run. Jump. Stomp. Don't fall.</p>
      <p id="title-best-row" class="best hidden">Best <strong id="title-best">0</strong></p>
      <button id="btn-play" class="btn primary">▶ Play</button>
      <button id="btn-fullscreen" class="btn ghost">⛶ Fullscreen</button>
      <p id="controls-hint" class="hint"></p>
      <p class="rotate-hint">Rotate your phone for the best view ↻</p>
    </section>

    <section id="screen-pause" class="screen hidden">
      <h2>Paused</h2>
      <button id="btn-resume" class="btn primary">Resume</button>
      <button id="btn-sound-pause" class="btn ghost">Sound</button>
      <button id="btn-quit" class="btn ghost">Quit to title</button>
    </section>

    <section id="screen-over" class="screen hidden">
      <h2>Game Over</h2>
      <p id="over-newbest" class="newbest hidden">★ New best! ★</p>
      <div class="score-big"><span id="over-score">0</span></div>
      <dl class="stats">
        <dt>Distance</dt><dd id="over-dist">0 m</dd>
        <dt>Coins</dt><dd id="over-coins">0</dd>
        <dt>Stomps</dt><dd id="over-kills">0</dd>
        <dt>Best</dt><dd id="over-best">0</dd>
      </dl>
      <button id="btn-retry" class="btn primary">↻ Play again</button>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
